[project]
name = "energy-anomaly-backend"
version = "0.1.0"
description = "Enterprise Energy Anomaly Detection and Forecasting System - Backend API & Streaming Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "kafka-python>=2.0.2",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.1.0",
    "scikit-learn>=1.4.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.28.0",
    "xgboost>=2.0.0",
]

[tool.uv]
package = false
